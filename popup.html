<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Agenda</title><link rel="stylesheet" href="styles.css"></head><body class="popup-page"><main class="popup"><header class="popup-header"><div><span class="eyebrow">HOJE</span><h1 id="todayLabel">Minha Agenda</h1></div><button id="openAgendaBtn" class="icon-btn" title="Abrir agenda completa">↗</button></header><section class="quick-add"><input id="quickTitle" type="text" placeholder="Novo compromisso..."><input id="quickDate" type="date"><input id="quickTime" type="time"><select id="quickReminder"><option value="10">10 min antes</option><option value="0">Na hora</option><option value="-1">Sem lembrete</option></select><button id="quickAddBtn" class="primary-btn">Adicionar compromisso</button></section><section><div class="section-title-row"><h2>Próximos</h2><span id="eventCount" class="badge">0</span></div><div id="upcomingList" class="event-list"></div></section><section class="popup-tasks"><div class="section-title-row"><h2>Tarefas abertas</h2><button id="openTasksBtn" class="text-btn">Ver todas</button></div><div id="popupTasksList" class="event-list"></div></section></main><script src="popup.js"></script></body></html>
